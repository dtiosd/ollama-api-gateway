worker_processes  auto;

events {
    worker_connections  1024;
}

http {
    client_max_body_size 100M;
    sendfile on;
    keepalive_timeout 65s;

    upstream ollama_api_backend {
        server 127.0.0.1:8001;
        keepalive 32;
    }

    # ---------- ollama 兼容网关（管理页 + OpenAI 兼容接口，需 API Key）----------
    # uvicorn: uvicorn app.main:app --host 127.0.0.1 --port 8001
    server {
        listen 8000;
        # 改成你的域名或主机 IP；不基于 Host 区分时保持 _ 即可
        server_name _;

        location / {
            proxy_pass http://ollama_api_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Authorization $http_authorization;

            # 流式输出
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
            proxy_set_header Connection "";
        }

        # 管理接口额外的一道防线：仅允许指定内网段访问（ADMIN_TOKEN 仍必须配置）
        location /backend/ {
            # allow 10.0.0.0/8;
            # deny all;
            proxy_pass http://ollama_api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
